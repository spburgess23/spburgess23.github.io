# Site identity — edit these two lines to rebrand the whole site.
name: SP Burgess
title: SP Burgess Projects

description: >-
  The projects of SP Burgess — centred on Bole Hill Quarry, scanned in
  walkable 3D, alongside workshop builds and other experiments.

# Custom domain (burgess.cc, registered at Cloudflare — see DOMAIN.md)
url: "https://burgess.cc"

permalink: pretty
markdown: kramdown

# Jekyll Admin (local visual editor): open straight on the Rooms collection.
# This key is also required — without it the admin's boot handler crashes.
jekyll_admin:
  homepage: rooms

# Room pages are generated from the _rooms/ collection.
# Add a room = run ./add_room.sh <path-to-room>_MOBILE_OUT>  — that's it.
collections:
  rooms:
    output: true
  projects:
    output: true

defaults:
  - scope:
      path: ""
      type: rooms
    values:
      layout: room
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: pages
    values:
      layout: page

sass:
  style: compressed

# Keep repo housekeeping files out of the published site.
exclude:
  - add_room.sh
  - Gemfile
  - Gemfile.lock
  - README.md
  - DOMAIN.md
  - MAINTENANCE.md
  - vendor
